services:
  postgres:
    image: postgres:16-alpine
    container_name: sendo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "54322:5432"
    volumes:
      - sendo_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sendo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sendo_redis_data:/data

volumes:
  sendo_pg_data:
  sendo_redis_data:
